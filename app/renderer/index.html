<!doctype html>
<html lang="ru" data-theme="dark" data-accent="purple">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: https: http://127.0.0.1:*; media-src 'self' file: blob: https: http://127.0.0.1:*; connect-src 'self' https: http://127.0.0.1:*; object-src 'none'; base-uri 'none'; frame-src 'none';" />
  <title data-i18n="AppName"></title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="lyrics-view.css" />
  <link rel="stylesheet" href="surfaces.css" />
  <link rel="stylesheet" href="release-center.css">
  <link rel="stylesheet" href="online-search.css">
  <link rel="stylesheet" href="track-tools.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="titlebar">
      <div class="brand drag-region">
        <img class="brand-icon" src="../assets/icon.png" alt="" />
        <div class="brand-copy"><strong data-i18n="AppName"></strong><span data-i18n="AppTagline"></span></div>
      </div>
      <div class="top-search no-drag">
        <span class="search-icon" data-icon="search"></span>
        <input id="searchInput" type="search" spellcheck="false" autocomplete="off" placeholder="" data-i18n-placeholder="UIFindATrackOrArtist" aria-label="" data-i18n-aria-label="UISearchLibrary" />
        <kbd data-i18n="UICtrlK"></kbd>
      </div>
      <div class="header-actions no-drag">
        <button id="onlineBtn" class="button secondary" title="" data-i18n-title="UISearchAndDownloadFromTheInternet"><span data-icon="cloudDownload"></span><span data-i18n="UIOnline"></span></button>
        <button id="addBtn" class="button primary" title="" data-i18n-title="UIAddFiles"><span data-icon="plus"></span><span data-i18n="UIAdd"></span></button>
        <button id="settingsBtn" class="icon-button" title="" data-i18n-title="SettingsButton"><span data-icon="settings"></span></button>
      </div>
      <div class="window-controls no-drag" aria-label="" data-i18n-aria-label="UIWindowControls">
        <button id="minBtn" class="window-button" title="" data-i18n-title="UIMinimise"><span data-icon="minus"></span></button>
        <button id="maxBtn" class="window-button" title="" data-i18n-title="UIMaximise"><span data-icon="maximize"></span></button>
        <button id="closeBtn" class="window-button close" title="" data-i18n-title="UIClose"><span data-icon="close"></span></button>
      </div>
    </header>

    <main class="content">
      <section class="hero-row">
        <div>
          <h1 data-i18n="UIMyMusic"></h1>
          <p id="libraryMeta" data-i18n="UILoadingYourLibrary"></p>
        </div>
        <div class="hero-actions">
          <button id="folderBtn" class="icon-button labeled" title="" data-i18n-title="UIOpenTheMusicFolder"><span data-icon="folder"></span><span data-i18n="UIMusicFolder"></span></button>
          <button id="refreshBtn" class="icon-button" title="" data-i18n-title="UIRefresh"><span data-icon="refresh"></span></button>
        </div>
      </section>

      <section class="toolbar" aria-label="" data-i18n-aria-label="UIFiltersAndView">
        <div class="category-zone">
          <div id="hiddenCategories" class="hidden-categories hidden" aria-label="" data-i18n-aria-label="UIHiddenPlaylists"></div>
          <div id="categoryChips" class="chips category-tabs" role="tablist"></div>
        </div>
        <div class="toolbar-right">
          <div id="sortControl" class="custom-select">
            <button id="sortTrigger" class="select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span data-icon="sort"></span><span id="sortLabel" data-i18n="UINewestFirst"></span><span data-icon="chevronDown"></span>
            </button>
            <div id="sortPopover" class="select-popover sort-popover-wide hidden" role="listbox" aria-label="" data-i18n-aria-label="UISorting">
              <button type="button" role="option" data-sort="manual"><span data-i18n="UICustomOrder"></span><span data-icon="check"></span></button>
              <button type="button" role="option" data-sort="recent"><span data-i18n="UINewestFirst"></span><span data-icon="check"></span></button>
              <button type="button" role="option" data-sort="old"><span data-i18n="UIOldestFirst"></span><span data-icon="check"></span></button>
              <button type="button" role="option" data-sort="title"><span data-i18n="UITitleAZ"></span><span data-icon="check"></span></button>
              <button type="button" role="option" data-sort="titleDesc"><span data-i18n="UITitleZA"></span><span data-icon="check"></span></button>
              <button type="button" role="option" data-sort="artist"><span data-i18n="UIByArtist"></span><span data-icon="check"></span></button>
              <button type="button" role="option" data-sort="album"><span data-i18n="UIByAlbum"></span><span data-icon="check"></span></button>
              <button type="button" role="option" data-sort="durationAsc"><span data-i18n="UIShortestFirst"></span><span data-icon="check"></span></button>
              <button type="button" role="option" data-sort="durationDesc"><span data-i18n="UILongestFirst"></span><span data-icon="check"></span></button>
              <button type="button" role="option" data-sort="source"><span data-i18n="UIBySource"></span><span data-icon="check"></span></button>
              <button type="button" role="option" data-sort="sizeDesc"><span data-i18n="UIByFileSize"></span><span data-icon="check"></span></button>
              <button type="button" role="option" data-sort="loudnessAsc"><span data-i18n="LoudnessAscending"></span><span data-icon="check"></span></button>
              <button type="button" role="option" data-sort="loudnessDesc"><span data-i18n="LoudnessDescending"></span><span data-icon="check"></span></button>
            </div>
          </div>
          <div class="toolbar-toggle-group" role="group" aria-label="" data-i18n-aria-label="UILibraryView">
            <div class="segmented compact-segmented">
              <button id="gridViewBtn" class="segment active" title="" data-i18n-title="UICards" aria-label="" data-i18n-aria-label="UICards"><span data-icon="grid"></span></button>
              <button id="listViewBtn" class="segment" title="" data-i18n-title="UIList" aria-label="" data-i18n-aria-label="UIList"><span data-icon="list"></span></button>
            </div>
            <div id="playlistLayoutControl" class="segmented compact-segmented" role="group" aria-label="" data-i18n-aria-label="UIPlaylistLayout">
              <button class="segment" data-category-layout="top" title="" data-i18n-title="UIPlaylistsAtTheTop" aria-label="" data-i18n-aria-label="UIPlaylistsAtTheTop"><span data-icon="more"></span></button>
              <button class="segment" data-category-layout="side" title="" data-i18n-title="UIPlaylistsOnTheSide" aria-label="" data-i18n-aria-label="UIPlaylistsOnTheSide"><span data-icon="list"></span></button>
            </div>
          </div>
        </div>
      </section>
      <aside id="categorySidebar" class="category-sidebar hidden" aria-label="" data-i18n-aria-label="UIPlaylistsOnTheSide"></aside>

      <section id="dropHint" class="drop-hint hidden"><span data-icon="music"></span><span data-i18n="UIPlaceAudioFilesInThe"></span> <strong data-i18n="UIMusic"></strong> <span data-i18n="UIFolderTheyWillAppearHereAutomatically"></span></section>
      <section id="library" class="library grid-view" role="listbox" aria-label="" data-i18n-aria-label="UITracksDragFromAnEmptyAreaOrHold" aria-multiselectable="true" aria-live="polite"></section>
      <section id="emptyState" class="empty-state hidden">
        <div class="empty-orb"><span data-icon="music"></span></div>
        <h2 data-i18n="UIItIsQuietHereForNow"></h2>
        <p><span data-i18n="UIAddFilesUsingTheButtonAbovePutThem"></span> <b data-i18n="UIMusic"></b> <span data-i18n="UIOrFindATrackOnline"></span></p>
        <div class="empty-actions">
          <button id="emptyAddBtn" class="button primary"><span data-icon="plus"></span><span data-i18n="UIAddFiles"></span></button>
          <button id="emptyOnlineBtn" class="button secondary"><span data-icon="search"></span><span data-i18n="UIFindOnline"></span></button>
        </div>
      </section>
    </main>

    <footer id="player" class="player disabled">
      <div class="now-playing">
        <div id="playerCover" class="cover tiny placeholder"><span data-icon="music"></span></div>
        <div class="now-copy"><strong id="playerTitle" data-i18n="UISelectATrack"></strong><span id="playerArtist" data-i18n="AppName"></span></div>
        <button id="playerFavorite" class="icon-button subtle" title="" data-i18n-title="UIAddToFavourites" disabled><span data-icon="heart"></span></button>
      </div>
      <div class="transport">
        <div class="transport-buttons">
          <button id="shuffleBtn" class="icon-button subtle" title="" data-i18n-title="UIShuffle"><span data-icon="shuffle"></span></button>
          <button id="prevBtn" class="icon-button" title="" data-i18n-title="UIPrevious"><span data-icon="skipBack"></span></button>
          <button id="playBtn" class="play-button" title="" data-i18n-title="UIPlay2"><span data-icon="play"></span></button>
          <button id="nextBtn" class="icon-button" title="" data-i18n-title="UINext"><span data-icon="skipForward"></span></button>
          <button id="repeatBtn" class="icon-button subtle" title="" data-i18n-title="UIRepeat"><span data-icon="repeat"></span></button>
        </div>
        <div class="timeline">
          <span id="currentTime">0:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="" data-i18n-aria-label="UIPosition" />
          <span id="totalTime">0:00</span>
        </div>
      </div>
      <div class="volume-block">
        <button id="muteBtn" class="icon-button subtle" title="" data-i18n-title="UISound"><span data-icon="volume"></span></button>
        <input id="volume" type="range" min="0" max="100" value="82" aria-label="" data-i18n-aria-label="UIVolume" />
      </div>
      <audio id="audio" preload="metadata"></audio>
    </footer>
  </div>

  <div id="onlineModal" class="modal-layer hidden" aria-hidden="true">
    <div class="modal large" role="dialog" aria-modal="true" aria-labelledby="onlineTitle">
      <div class="modal-header">
        <div><span class="eyebrow" data-i18n="UIOnlineImport"></span><h2 id="onlineTitle" data-i18n="UIFindAndAddMusic"></h2></div>
        <button class="icon-button modal-close" data-close="onlineModal" title="" data-i18n-title="UIClose"><span data-icon="close"></span></button>
      </div>
      <div id="searchWorkspace">
      <div class="source-tabs" role="tablist">
        <button class="source-tab active" data-provider="youtube"><span data-icon="youtube"></span><span data-i18n="UIYouTube"></span></button>
        <button class="source-tab" data-provider="soundcloud"><span data-icon="wave"></span><span data-i18n="UISoundCloud"></span></button>
      </div>
      <div class="online-search-row">
        <div class="modal-search"><span data-icon="search"></span><input id="onlineSearchInput" placeholder="" data-i18n-placeholder="SearchNameOrLink" spellcheck="false" /><button id="onlineSearchBtn" class="button primary" data-i18n="UIFind"></button></div>
      </div>
      <div id="onlineNotice" class="notice"><span data-icon="info"></span><span data-i18n="UIYouCanPreviewAResultFirstTrimmingBefore"></span></div>
      <div id="onlinePreviewBar" class="online-preview-bar hidden">
        <button id="onlinePreviewToggle" class="preview-play" title="" data-i18n-title="UIPausePlay"><span data-icon="pause"></span></button>
        <div class="online-preview-copy"><strong id="onlinePreviewTitle" data-i18n="UIAudioPreview"></strong><span id="onlinePreviewArtist"></span></div>
        <div class="online-preview-time"><span id="onlinePreviewCurrent">0:00</span><span>/</span><span id="onlinePreviewDuration">0:00</span></div>
        <button id="onlinePreviewMute" class="icon-button subtle" type="button" aria-pressed="false" data-i18n-aria-label="SearchMute" data-i18n-title="SearchMute"></button>
        <button id="onlinePreviewClose" class="icon-button subtle" title="" data-i18n-title="UIStop"><span data-icon="close"></span></button>
      </div>
      <div id="onlineResults" class="online-results"></div>
      <audio id="onlinePreviewAudio" preload="none"></audio>
      </div>
    </div>
  </div>

  <div id="searchPopover" class="search-popover hidden"></div>

  <div id="trimModal" class="modal-layer hidden" aria-hidden="true">
    <div class="modal trim-modal" role="dialog" aria-modal="true" aria-labelledby="trimTitle">
      <div class="modal-header">
        <div><span class="eyebrow" data-i18n="UIYouTubeBeforeDownloading"></span><h2 id="trimTitle" data-i18n="UITrimTrack"></h2></div>
        <button class="icon-button modal-close" data-close="trimModal" title="" data-i18n-title="UIClose"><span data-icon="close"></span></button>
      </div>
      <div class="trim-media">
        <div id="trimCover" class="cover trim-cover placeholder"><span data-icon="music"></span></div>
        <div class="trim-copy"><strong id="trimTrackTitle" data-i18n="PlaylistIconTrack"></strong><span id="trimTrackArtist" data-i18n="LyricsArtist"></span><small id="trimTrackDuration">0:00</small></div>
      </div>
      <div id="autoTrimCard" class="auto-trim-card" tabindex="0" title="" data-i18n-title="UIDoubleClickToApplyTheSuggestion">
        <div class="auto-trim-icon"><span data-icon="sparkles"></span></div>
        <div><strong data-i18n="UIAutomaticSuggestion"></strong><span id="autoTrimText" data-i18n="UIAnalysingMusicalActivity"></span><small id="autoTrimMethod" data-i18n="UIDoubleClickToApplyTheSuggestedBoundaries"></small></div>
        <button id="applyAutoTrim" class="button secondary" disabled data-i18n="UIApply"></button>
      </div>
      <div id="trimTimeline" class="trim-timeline" aria-label="" data-i18n-aria-label="UIAudioPreviewPosition">
        <div id="trimWave" class="trim-wave" aria-hidden="true"></div>
        <input id="trimSeek" class="trim-seek" type="range" min="0" max="100" step="0.05" value="0" aria-label="" data-i18n-aria-label="UIPlaybackPosition" />
        <i id="trimPlayhead" class="trim-playhead" aria-hidden="true"></i>
      </div>
      <div class="trim-transport" role="group" aria-label="" data-i18n-aria-label="UIAudioPreviewControls">
        <button id="trimJumpStart" class="trim-transport-button" title="" data-i18n-title="UIGoToTheStartOfTheVideo" aria-label="" data-i18n-aria-label="UIGoToTheStartOfTheVideo"><span data-icon="jumpStart"></span></button>
        <button id="trimRewind" class="trim-transport-button" title="" data-i18n-title="LyricsBackSeconds" aria-label="" data-i18n-aria-label="LyricsBackSeconds"><span data-icon="rewind"></span></button>
        <button id="trimPreviewToggle" class="trim-transport-button primary" title="" data-i18n-title="UIPlay2" aria-label="" data-i18n-aria-label="UIPlay2"><span data-icon="play"></span></button>
        <button id="trimForward" class="trim-transport-button" title="" data-i18n-title="LyricsForwardSeconds" aria-label="" data-i18n-aria-label="LyricsForwardSeconds"><span data-icon="forward"></span></button>
        <span class="trim-position"><output id="trimPreviewCurrent">0:00</output><span>/</span><output id="trimPreviewTotal">0:00</output></span>
      </div>
      <div class="trim-controls">
        <div class="trim-control-row">
          <div class="trim-control-head"><label for="trimStart" data-i18n="LyricsStart"></label><output id="trimStartValue">0:00</output></div>
          <input id="trimStart" type="range" min="0" max="100" value="0" step="0.1" />
          <div class="trim-nudges"><button data-trim-nudge="start:-5" data-i18n="UIS3"></button><button data-trim-nudge="start:-1" data-i18n="UIS4"></button><button data-trim-nudge="start:1" data-i18n="UIS5"></button><button data-trim-nudge="start:5" data-i18n="UIS6"></button></div>
        </div>
        <div class="trim-control-row">
          <div class="trim-control-head"><label for="trimEnd" data-i18n="LyricsEnd"></label><output id="trimEndValue">0:00</output></div>
          <input id="trimEnd" type="range" min="0" max="100" value="100" step="0.1" />
          <div class="trim-nudges"><button data-trim-nudge="end:-5" data-i18n="UIS3"></button><button data-trim-nudge="end:-1" data-i18n="UIS4"></button><button data-trim-nudge="end:1" data-i18n="UIS5"></button><button data-trim-nudge="end:5" data-i18n="UIS6"></button></div>
        </div>
      </div>
      <div class="trim-summary"><span id="trimSummary" data-i18n="UIEntireTrackWillBeDownloaded"></span><button id="resetTrim" class="text-button" data-i18n="UIResetTrimming"></button></div>
      <div class="trim-actions"><button id="trimCancel" class="button secondary" data-i18n="LyricsCancel"></button><button id="trimDownload" class="button primary"><span data-icon="download"></span><span data-i18n="UIDownloadSelectedSegment"></span></button></div>
      <audio id="trimPreviewAudio" preload="none"></audio>
    </div>
  </div>

  <div id="settingsModal" class="modal-layer hidden" aria-hidden="true">
    <div class="modal settings-modal settings-hub" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="modal-header settings-header"><div><span class="eyebrow" data-i18n="SettingsButton"></span><h2 id="settingsTitle" data-i18n="UIMakePulseDeckYours"></h2><p class="settings-subtitle" data-i18n="UIAppearancePlayerShortcutsAndLibrary"></p></div><button class="icon-button modal-close" data-close="settingsModal" title="" data-i18n-title="UIClose"><span data-icon="close"></span></button></div>
      <div class="settings-layout">
        <nav class="settings-nav" aria-label="" data-i18n-aria-label="UISettingsSections">
          <button class="settings-nav-item active" data-settings-page="appearance" data-i18n-title="UIAppearance" data-i18n-aria-label="UIAppearance"><span data-icon="palette"></span><span><b data-i18n="UIAppearance"></b><small data-i18n="UIThemeBackgroundAndIcon"></small></span></button>
          <button class="settings-nav-item" data-settings-page="presets" data-i18n-title="PresetsTitle" data-i18n-aria-label="PresetsTitle"><span data-icon="save"></span><span><b data-i18n="PresetsTitle"></b><small data-i18n="PresetsNavHint"></small></span></button>
          <button class="settings-nav-item" data-settings-page="player" data-i18n-title="UIPlayer" data-i18n-aria-label="UIPlayer"><span data-icon="music"></span><span><b data-i18n="UIPlayer"></b><small data-i18n="UIPopupAndPersistent"></small></span></button>
          <button class="settings-nav-item" data-settings-page="games" data-i18n-title="UIGameOverlay" data-i18n-aria-label="UIGameOverlay"><span data-icon="gamepad"></span><span><b data-i18n="UIGameOverlay"></b><small data-i18n="UIOverGamesAndFullScreenApps"></small></span></button>
          <button class="settings-nav-item" data-settings-page="hotkeys" data-i18n-title="UIKeyboardShortcuts2" data-i18n-aria-label="UIKeyboardShortcuts2"><span data-icon="bars"></span><span><b data-i18n="UIKeyboardShortcuts2"></b><small data-i18n="UIControlsOverGames"></small></span></button>
          <button class="settings-nav-item" data-settings-page="updates" data-i18n-title="UpdatesTitle" data-i18n-aria-label="UpdatesTitle"><span data-icon="download"></span><span><b data-i18n="UpdatesTitle"></b><small data-i18n="UpdatesNavSubtitle"></small></span></button>
          <button class="settings-nav-item" data-settings-page="language" data-i18n-title="LanguageSettingsTitle" data-i18n-aria-label="LanguageSettingsTitle"><span data-icon="globe"></span><span><b data-i18n="LanguageSettingsTitle"></b><small data-i18n="LanguageSettingsDescription"></small></span></button>
          <button class="settings-nav-item" data-settings-page="library" data-i18n-title="UILibrary" data-i18n-aria-label="UILibrary"><span data-icon="folder"></span><span><b data-i18n="UILibrary"></b><small data-i18n="UIFilesAndStorage"></small></span></button>
          <button id="settingsAbout" class="settings-about" data-settings-page="about" type="button" title="" data-i18n-title="AboutTitle">
            <img class="settings-about-icon" src="../assets/app-icons/blue-violet-monitor.png" alt="" draggable="false">
            <span class="settings-about-copy"><strong><span data-i18n="AppName"></span> <span id="appVersion"></span></strong><small data-i18n="AppTagline"></small></span>
            <span class="settings-about-arrow" aria-hidden="true">›</span>
          </button>
        </nav>
        <div class="settings-pages">
          <section class="settings-page presets-settings-page" data-settings-panel="presets">
            <div class="settings-page-header"><div><h3 data-i18n="PresetsTitle"></h3><p class="setting-help" data-i18n="PresetsDescription"></p></div><button id="presetCreate" class="button primary" type="button"><span data-icon="plus"></span><span data-i18n="PresetsCreate"></span></button></div>
            <div id="presetList" class="preset-list"></div>
            <p id="presetStatus" class="setting-help" role="status" aria-live="polite"></p>
            <p class="preset-scope-note setting-help" data-i18n="PresetsSafeScope"></p>
          </section>
          <section class="settings-page active" data-settings-panel="appearance">
            <div class="settings-page-title"><h3 data-i18n="UIAppearance"></h3><p data-i18n="UIMakePulseDeckYourOwnWithoutVisualClutter"></p></div>
            <div class="setting-block theme-block">
              <div class="setting-label-row"><label data-i18n="UIColourTheme"></label><small data-i18n="UICompactPalettesHoverForNames"></small></div>
              <div id="themeRail" class="theme-grid" role="radiogroup" aria-label="" data-i18n-aria-label="UIColourTheme">
                <button class="theme-option theme-swatch dark" data-theme="dark" title="" data-i18n-title="UINight" aria-label="" data-i18n-aria-label="UINight"><i></i><b></b><em></em></button>
                <button class="theme-option theme-swatch graphite" data-theme="graphite" title="" data-i18n-title="UIGraphite" aria-label="" data-i18n-aria-label="UIGraphite"><i></i><b></b><em></em></button>
                <button class="theme-option theme-swatch ocean" data-theme="ocean" title="" data-i18n-title="UIOcean" aria-label="" data-i18n-aria-label="UIOcean"><i></i><b></b><em></em></button>
                <button class="theme-option theme-swatch forest" data-theme="forest" title="" data-i18n-title="UIForest" aria-label="" data-i18n-aria-label="UIForest"><i></i><b></b><em></em></button>
                <button class="theme-option theme-swatch midnight" data-theme="midnight" title="" data-i18n-title="UIMidnight" aria-label="" data-i18n-aria-label="UIMidnight"><i></i><b></b><em></em></button>
                <button class="theme-option theme-swatch plum" data-theme="plum" title="" data-i18n-title="UIPlum" aria-label="" data-i18n-aria-label="UIPlum"><i></i><b></b><em></em></button>
                <button class="theme-option theme-swatch ember" data-theme="ember" title="" data-i18n-title="UIEmber" aria-label="" data-i18n-aria-label="UIEmber"><i></i><b></b><em></em></button>
                <button class="theme-option theme-swatch nord" data-theme="nord" title="" data-i18n-title="UINord" aria-label="" data-i18n-aria-label="UINord"><i></i><b></b><em></em></button>
                <button class="theme-option theme-swatch aurora" data-theme="aurora" title="" data-i18n-title="UIAurora" aria-label="" data-i18n-aria-label="UIAurora"><i></i><b></b><em></em></button>
                <button class="theme-option theme-swatch dawn" data-theme="dawn" title="" data-i18n-title="UIDawn" aria-label="" data-i18n-aria-label="UIDawn"><i></i><b></b><em></em></button>
                <button class="theme-option theme-swatch light" data-theme="light" title="" data-i18n-title="UILight" aria-label="" data-i18n-aria-label="UILight"><i></i><b></b><em></em></button>

      <div class="category-editor-section"><label data-i18n="UIIcon"></label><div id="categoryIconGrid" class="category-icon-grid"></div></div>
      <div class="category-editor-section"><label data-i18n="UIColour"></label><div id="categoryColorOptions" class="category-color-options"></div></div>
      <label class="switch-row"><input id="categoryGlowToggle" type="checkbox"><span></span><b data-i18n="UIGlow"></b><small data-i18n="UIGradientRisesSoftlyFromThePlaylistLine"></small></label>
      <div id="categoryGlowSettings" class="category-glow-settings hidden">
        <div class="intensity-row"><label data-i18n="UIIntensity"></label><input id="categoryGlowIntensity" type="range" min="0" max="100" value="45"><output id="categoryGlowIntensityValue">45%</output></div>
        <div class="gradient-head"><label><span data-i18n="LyricsGradient"></span> <small id="gradientCount">1/4</small></label></div>
        <div id="categoryGradientList" class="category-gradient-list"></div>
        <button id="addGradientColorBtn" class="button secondary full"><span data-icon="plus"></span><span data-i18n="LyricsAddColour"></span></button>
      </div>
      <div id="categoryPreview" class="category-preview"></div>
      <div class="vault-editor-security">
        <label><input id="categoryProtectedToggle" type="checkbox"> <span data-i18n="UIProtectedPlaylist"></span></label>
        <div id="categoryPasswordFields" class="hidden">
          <label class="vault-password-field"><span data-i18n="UIPasswordCharacters"></span><input id="categoryPasswordInput" type="password" maxlength="96" autocomplete="new-password" spellcheck="false"></label>
          <label class="vault-password-field"><span data-i18n="UIRepeatPassword"></span><input id="categoryPasswordConfirm" type="password" maxlength="96" autocomplete="new-password" spellcheck="false"></label>
          <p class="vault-warning" data-i18n="UISongsWillDisappearFromOtherPlaylistsAndWill"></p>
        </div>
        <p id="categoryProtectionNote" class="hidden" data-i18n="UIThisPlaylistIsAlreadyProtectedDisablingProtectionRequires"></p>
      </div>
      <div class="color-actions"><button id="categoryStyleCancel" class="button secondary" data-i18n="LyricsCancel"></button><button id="categoryStyleSave" class="button primary" data-i18n="UISave"></button></div>
    </div>
  </div>

  <div id="confirmModal" class="modal-layer hidden" aria-hidden="true">
    <div class="modal compact" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <div class="confirm-icon" id="confirmIcon"><span data-icon="trash"></span></div>
      <h2 id="confirmTitle" data-i18n="UIConfirmAction"></h2>
      <p id="confirmText" data-i18n="UIReviewTheActionBeforeContinuing"></p>
      <div class="confirm-actions"><button id="confirmCancel" class="button secondary" data-i18n="LyricsCancel"></button><button id="confirmDelete" class="button primary" data-i18n="UIConfirm"></button></div>
    </div>
  </div>

  <div id="mergeModal" class="modal-layer hidden" aria-hidden="true">
    <div class="modal merge-modal" role="dialog" aria-modal="true" aria-labelledby="mergeTitle">
      <div class="modal-header"><div><span class="eyebrow" data-i18n="UIPLAYLISTS"></span><h2 id="mergeTitle" data-i18n="UIHowShouldTheseBeMerged"></h2></div></div>
      <p id="mergePlaylistNames" class="merge-playlist-names"></p>
      <p class="merge-explanation" data-i18n="UISelectADestinationPlaylistACustomSourceWill"></p>
      <div id="mergeChoices" class="merge-choices" role="radiogroup" aria-label="" data-i18n-aria-label="UIWhichPlaylistToKeep"></div>
      <p id="mergeError" class="merge-error" role="alert"></p>
      <div class="confirm-actions"><button id="mergeCancel" class="button secondary" data-i18n="LyricsCancel"></button><button id="mergeConfirm" class="button primary" disabled data-i18n="UIMerge"></button></div>
    </div>
  </div>
  <div id="trackSelectionStatus" class="track-selection-status hidden" role="status">
    <strong id="trackSelectionCount" data-i18n="UISelected3"></strong><span data-i18n="UIEscToClear"></span>
    <button id="trackSelectionActions" type="button" data-i18n="UIActions"></button>
    <button id="trackSelectionClear" type="button" aria-label="" data-i18n-aria-label="UIClearSelection" title="" data-i18n-title="UIClearSelection"><span data-icon="close"></span></button>
  </div>
  <span id="reorderStatus" class="sr-only" role="status" aria-live="polite"></span>
  <div id="contextMenu" class="context-menu hidden" role="menu"></div>
  <div id="toastStack" class="toast-stack" aria-live="polite"></div>

  <div id="vaultPasswordModal" class="modal-layer hidden" aria-hidden="true">
    <div class="modal vault-password-modal" role="dialog" aria-modal="true" aria-labelledby="vaultPasswordTitle">
      <div class="modal-header"><div><span class="eyebrow" data-i18n="UIProtectedPlaylist"></span><h2 id="vaultPasswordTitle" data-i18n="UIEnterPassword"></h2></div><button class="icon-button modal-close" data-close="vaultPasswordModal" title="" data-i18n-title="UIClose"><span data-icon="close"></span></button></div>
      <form id="vaultPasswordForm" class="vault-password-body" autocomplete="off">
        <p id="vaultPasswordText"></p><div id="vaultPasswordFields"></div><p id="vaultPasswordError" class="vault-error" role="alert"></p>
        <div class="vault-password-actions"><button type="button" class="button secondary" data-close="vaultPasswordModal" data-i18n="LyricsCancel"></button><button type="submit" id="vaultPasswordSubmit" class="button primary" data-i18n="PlayerOverlayResume"></button></div>
      </form>
    </div>
  </div>
