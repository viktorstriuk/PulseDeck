<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none';"><title data-i18n="AppName"></title><link rel="stylesheet" href="styles.css"></head><body>
 <div class="setup-canvas">
  <div class="floating-logo" aria-hidden="true"><img src="../../app/assets/app-icons/blue-violet-monitor.png" alt=""></div>
  <main class="setup-shell" id="setupShell">
   <header class="window-head"><span class="wordmark"><span class="wordmark-name" data-i18n="AppName"></span><span id="version"></span></span><div class="window-actions"><div class="language-switch" id="languageSwitch"><button id="languageTrigger" class="language-trigger" type="button" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="languageList" data-i18n-aria-label="SetupLanguage"><span id="languageFlag" class="language-flag" aria-hidden="true"></span><span id="languageCode"></span><span class="language-chevron" aria-hidden="true"></span></button><div id="languageList" class="language-list" role="listbox" data-i18n-aria-label="SetupLanguage" hidden></div></div><button id="minimize" class="window-button" data-i18n-title="SetupMinimize" data-i18n-aria-label="SetupMinimize"><span data-icon="minus"></span></button><button id="close" class="window-button close" data-i18n-title="SetupClose" data-i18n-aria-label="SetupClose"><span data-icon="close"></span></button></div></header>
   <div class="setup-content">
    <aside class="identity-pane"><h1 data-i18n="SetupHeadline"></h1><p class="intro" data-i18n="SetupDescription"></p>
     <div class="signal-art" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
     <div class="feature-stack"><span><i data-icon="folder"></i><span data-i18n="SetupLocalFirst"></span></span><span><i class="user-off-icon" aria-hidden="true"></i><span data-i18n="SetupNoAccount"></span></span><span><i data-icon="heart"></i><span data-i18n="SetupMIT"></span></span></div>
     <div class="maker"><img src="../../app/assets/author/mushep.png" alt="MusheP"><span data-i18n="SetupMaker"></span></div>
    </aside>
    <section class="flow-pane">
     <div id="welcomeView" class="flow-view"><span class="step-label" data-i18n="SetupTitle"></span><h2 data-i18n="SetupWelcome"></h2><p class="subcopy" id="existingHint"></p>
      <div class="location-card"><label for="targetPath" data-i18n="SetupLocation"></label><div class="location-input"><span data-icon="folder"></span><input id="targetPath" spellcheck="false" autocomplete="off" data-i18n-aria-label="SetupLocation"></div><button id="browse" class="text-button"><span data-i18n="SetupBrowse"></span><span data-icon="chevronRight"></span></button></div>
      <label class="checkbox-card"><input id="desktop" type="checkbox" checked><span class="checkbox-visual" aria-hidden="true"><span data-icon="check"></span></span><span data-i18n="SetupDesktopShortcut"></span></label>
      <div class="safe-note"><span data-icon="lock"></span><p data-i18n="SetupPickExisting"></p></div>
      <div id="welcomeError" class="error-note" role="alert" hidden></div>
      <button id="install" class="primary-button"><span data-i18n="SetupInstall"></span><span data-icon="chevronRight"></span></button><small class="footer-note" data-i18n="SetupSpace"></small>
     </div>
     <div id="progressView" class="flow-view" hidden><div class="progress-orb" id="progressOrb"><span data-icon="download"></span></div><span class="step-label" id="progressStep"></span><h2 id="progressTitle"></h2><p class="subcopy" id="progressHint" data-i18n="SetupNoClose"></p><div class="setup-progress" id="setupProgress" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="progressFill"></i></div><div class="progress-meta"><span id="fileCount"></span><output id="percent">0%</output></div><div class="install-steps"><span data-phase="verifying"><i></i><span data-i18n="SetupVerifyStep"></span></span><span data-phase="installing"><i></i><span data-i18n="SetupInstallStep"></span></span><span data-phase="finalizing"><i></i><span data-i18n="SetupFinishStep"></span></span></div></div>
     <div id="resultView" class="flow-view" hidden><div class="result-orb" id="resultOrb"><span data-icon="check"></span></div><span class="step-label" id="resultStep"></span><h2 id="resultTitle"></h2><p class="subcopy" id="resultHint"></p><div class="result-path" id="resultPath"></div><button id="launch" class="primary-button"><span data-i18n="SetupLaunch"></span><span data-icon="play"></span></button><button id="retry" class="primary-button" hidden><span data-i18n="SetupRetry"></span><span data-icon="refresh"></span></button><button id="finishClose" class="secondary-button" data-i18n="SetupClose"></button></div>
    </section>
   </div>
   <footer class="legal-footer"><span data-i18n="SetupLegal"></span><span class="secure-foot" data-i18n="SetupPreservesData"></span></footer>
  </main>
  <dialog id="folderDialog" class="folder-dialog"><div class="folder-heading"><div><span class="step-label" data-i18n="SetupLocation"></span><h2 data-i18n="SetupBrowseTitle"></h2></div><button id="folderClose" class="window-button" data-i18n-aria-label="SetupClose"><span data-icon="close"></span></button></div><p data-i18n="SetupBrowseHint"></p><div id="places" class="places"></div><form id="folderForm" class="folder-path-row"><button id="parentFolder" type="button" class="window-button" data-i18n-title="SetupParent" data-i18n-aria-label="SetupParent"><span data-icon="arrowUp"></span></button><input id="folderPath" data-i18n-aria-label="SetupPath" spellcheck="false"><button class="secondary-button" data-i18n="SetupOpenPath"></button></form><div id="folderError" class="error-note" role="alert" hidden></div><div id="folderList" class="folder-list" role="list"></div><div class="folder-bottom"><button id="folderCancel" class="secondary-button" data-i18n="SetupCancel"></button><button id="useFolder" class="primary-button" data-i18n="SetupUseFolder"></button></div></dialog>
 </div><script src="../../app/renderer/icons.js"></script><script src="../../app/shared/language-choice.js"></script><script src="language-picker.js"></script><script src="ui.js"></script></body></html>
